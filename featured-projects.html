<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Featured projects by SEBS — Sebastián Méndez Villegas — Torke, Teleop Mobile Manipulator and Capa 8." />
  <title>SEBS — Featured Projects</title>
  <link rel="icon" type="image/png" sizes="32x32" href="assets/img/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="assets/img/favicon-48.png" />
  <link rel="apple-touch-icon" href="assets/img/apple-touch-icon.png" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <!-- Jerarquía SEBS: capa 0 → capa 1 → sitio. Ver index.html. -->
  <link rel="stylesheet" href="brand/tokens.css" />
  <link rel="stylesheet" href="brand/chrome.css" />
  <link rel="stylesheet" href="css/styles.css" />
</head>
<body>
  <!-- ===== Header ===== -->
  <header class="site-header surface-dark">
    <nav class="nav container" aria-label="Main">
      <a href="index.html" class="nav__logo" aria-label="SEBS — home">
        <img src="assets/img/logo-horizontal-invertido.png" alt="SEBS" />
      </a>
      <div class="nav__actions">
        <a class="nav__link" href="index.html">Projects</a>
        <a class="nav__link" href="featured-projects.html" aria-current="page">Featured</a>
        <a class="nav__link" href="index.html#about">About</a>
        <a class="nav__link" href="index.html#contact">Contact</a>
      </div>
    </nav>
  </header>

  <main>
    <!-- ===== Proyectos destacados ===== -->
    <section class="apps section" id="featured" style="padding-top: 3rem;">
      <div class="container">
        <header class="section-head section-head--center">
          <h1 class="section-head__title">Featured projects</h1>
        </header>

        <div class="apps__grid">

          <!-- LEAD: Torke — app en vivo, tarjeta ancha y horizontal -->
          <article class="app-card app-card--lead" id="torke">
            <div class="feature__video">
              <video src="assets/vid/Hero_torke.mp4" autoplay loop muted playsinline></video>
            </div>
            <div class="app-card__body">
              <div class="feature__actions">
                <a class="btn btn--white" href="https://torke.sebs.mx/" target="_blank" rel="noopener">
                  <img class="btn__logo" src="assets/img/imagotipo.png" alt="" />
                  Open Torke
                </a>
                <a class="btn btn--ghost-light" href="https://torke.sebs.mx/community"
                   target="_blank" rel="noopener">Community</a>
              </div>
            </div>
          </article>

          <!-- SUPPORT: Teleop Mobile Manipulator — sitio de documentación en vivo -->
          <article class="app-card app-card--support app-card--media" id="teleop-mobile-manipulator">
            <div class="feature__video feature__video--square">
              <video class="js-play-on-visible" src="assets/vid/Hero_remotehands.mp4" loop muted playsinline></video>
            </div>
            <div class="app-card__body">
              <div class="feature__actions">
                <a class="btn btn--white" href="https://remote-hands.sebs.mx/"
                   target="_blank" rel="noopener">Visit site</a>
                <a class="btn btn--ghost-light"
                   href="https://github.com/sebas30073007/teleop-mobile-manipulator"
                   target="_blank" rel="noopener">Repository</a>
              </div>
            </div>
          </article>

          <!-- SUPPORT: Capa 8 — app en vivo -->
          <article class="app-card app-card--support app-card--media" id="capa8">
            <div class="feature__video feature__video--square">
              <video class="js-play-on-visible" src="assets/vid/Hero_capa8.mp4" loop muted playsinline></video>
            </div>
            <div class="app-card__body">
              <div class="feature__actions">
                <a class="btn btn--white" href="https://capa8.sebs.mx/"
                   target="_blank" rel="noopener">Open Capa 8</a>
                <a class="btn btn--ghost-light"
                   href="https://github.com/sebas30073007/IA_mecatronica_Capa8"
                   target="_blank" rel="noopener">Repository</a>
              </div>
            </div>
          </article>

        </div>
      </div>
    </section>
  </main>

  <!-- ===== Cartela (capa 1; es el footer) ===== -->
  <footer class="cartela surface-dark" aria-label="Site record">
    <div class="cartela__firma">
      <img src="assets/img/Simbolo invertido.png" alt="SEBS" width="32" height="32" />
      <div>
        <p class="cartela__nombre">SEBS</p>
        <p class="cartela__linea">Engineering portfolio of Sebastián Méndez Villegas</p>
      </div>
    </div>
    <dl class="cartela__campos">
      <div class="cartela__campo"><dt>ID</dt><dd>SEBS-00</dd></div>
      <div class="cartela__campo"><dt>Updated</dt><dd><time datetime="2026-10-02">2026-10-02</time></dd></div>
      <div class="cartela__campo cartela__campo--estado">
        <dt>Status</dt>
        <dd><i class="dot dot--active" aria-hidden="true"></i>LIVE</dd>
      </div>
    </dl>
  </footer>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
